{# Risk pyramid: four slices of one triangle.
   Apex (250, 30), base y=390 from x=10 to x=490.
   Side edges share the slope dx/dy = ∓2/3, so each layer's top
   is the same width the layer above would have, inset by a uniform 6px gap. #}
<svg id="pyramid-svg" viewBox="-55 0 585 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;" role="img" aria-label="{{ pyr_aria }}">

  <g class="pyramid-layer" id="layer-minimal" data-layer="minimal" data-cy="348" role="button" tabindex="0" aria-pressed="false" aria-label="{{ pyr_min_label }}. {{ pyr_min_sub }}">
    <polygon points="10,390 490,390 434,306 66,306" fill="#1a9e8a"/>
    <text class="pyramid-layer-label" x="250" y="340">{{ pyr_min_label }}</text>
    <text class="pyramid-layer-sub" x="250" y="356">{{ pyr_min_sub }}</text>
  </g>

  <g class="pyramid-layer" id="layer-limited" data-layer="limited" data-cy="260" role="button" tabindex="0" aria-pressed="false" aria-label="{{ pyr_lim_label }}. {{ pyr_lim_sub }}">
    <polygon points="70,300 430,300 376,219 124,219" fill="#5B3F9E"/>
    <text class="pyramid-layer-label" x="250" y="252">{{ pyr_lim_label }}</text>
    <text class="pyramid-layer-sub" x="250" y="268">{{ pyr_lim_sub }}</text>
  </g>

  <g class="pyramid-layer" id="layer-high" data-layer="high" data-cy="173" role="button" tabindex="0" aria-pressed="false" aria-label="{{ pyr_high_label }}. {{ pyr_high_sub }}">
    <polygon points="128,213 372,213 318,132 182,132" fill="#C4408C"/>
    <text class="pyramid-layer-label" x="250" y="165">{{ pyr_high_label }}</text>
    <text class="pyramid-layer-sub" x="250" y="181">{{ pyr_high_sub }}</text>
  </g>

  <g class="pyramid-layer" id="layer-unacceptable" data-layer="unacceptable" data-cy="110" role="button" tabindex="0" aria-pressed="false" aria-label="{{ pyr_un_label }}. {{ pyr_un_sub }}">
    <polygon points="186,126 314,126 250,30" fill="#E05555"/>
    <text class="pyramid-layer-label" x="250" y="102">{{ pyr_un_label }}</text>
    <text class="pyramid-layer-sub" x="250" y="118">{{ pyr_un_sub }}</text>
  </g>

  <!-- Selection indicator: 3 arrows on the left, pointing at the active layer -->
  <polygon id="indicator-arrow-1" points="-22,338 -8,348 -22,358" fill="#1a9e8a" opacity="1"/>
  <polygon id="indicator-arrow-2" points="-36,338 -22,348 -36,358" fill="#1a9e8a" opacity="0.55"/>
  <polygon id="indicator-arrow-3" points="-50,338 -36,348 -50,358" fill="#1a9e8a" opacity="0.25"/>

</svg>
<script>
  const layers = ['minimal', 'limited', 'high', 'unacceptable'];

  const layerColors = {
    minimal:      '#1a9e8a',
    limited:      '#5B3F9E',
    high:         '#C4408C',
    unacceptable: '#E05555'
  };

  function moveIndicator(id) {
    const cy = Number(document.getElementById('layer-' + id).dataset.cy);
    const color = layerColors[id];
    const h = 10;

    document.getElementById('indicator-arrow-1').setAttribute('points', `-22,${cy - h} -8,${cy} -22,${cy + h}`);
    document.getElementById('indicator-arrow-1').setAttribute('fill', color);
    document.getElementById('indicator-arrow-2').setAttribute('points', `-36,${cy - h} -22,${cy} -36,${cy + h}`);
    document.getElementById('indicator-arrow-2').setAttribute('fill', color);
    document.getElementById('indicator-arrow-3').setAttribute('points', `-50,${cy - h} -36,${cy} -50,${cy + h}`);
    document.getElementById('indicator-arrow-3').setAttribute('fill', color);
  }

  function selectLayer(id) {
    layers.forEach(l => {
      const layer = document.getElementById('layer-' + l);
      layer.classList.remove('active');
      layer.setAttribute('aria-pressed', 'false');
      document.getElementById('panel-' + l).classList.remove('visible');
    });

    const selected = document.getElementById('layer-' + id);
    selected.classList.add('active');
    selected.setAttribute('aria-pressed', 'true');
    document.getElementById('panel-default').classList.remove('is-shown');
    document.getElementById('panel-' + id).classList.add('visible');
    moveIndicator(id);
  }

  document.querySelectorAll('.pyramid-layer').forEach(el => {
    // Keep the browser from scrolling the focused layer into view on click.
    el.addEventListener('mousedown', (e) => {
      e.preventDefault();
      el.focus({ preventScroll: true });
    });
    el.addEventListener('click', () => selectLayer(el.dataset.layer));
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectLayer(el.dataset.layer);
      }
    });
  });

  document.getElementById('pyramid-svg').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    const order = ['minimal', 'limited', 'high', 'unacceptable'];
    const active = layers.find(l => document.getElementById('layer-' + l).classList.contains('active'));
    const idx = order.indexOf(active);
    let next = null;
    if (e.key === 'ArrowUp' && idx < order.length - 1) next = order[idx + 1];
    if (e.key === 'ArrowDown' && idx > 0) next = order[idx - 1];
    if (!next) return;
    e.preventDefault();
    selectLayer(next);
    document.getElementById('layer-' + next).focus({ preventScroll: true });
  });

  setTimeout(() => selectLayer('minimal'), 400);
</script>
