<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% include '_google_analytics.html' %}
  <title>Observatório — Pedro Martins · AI Governance</title>
  <meta name="description" content="Observatório de indicadores sobre inteligência artificial, tecnologia e mercado de trabalho em Portugal e na União Europeia.">
  <link rel="canonical" href="https://ai-gov.network/observatorio">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      background: #f5f3ee;
      color: #1a2d3d;
      font-family: 'Barlow', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    nav {
      position: fixed;
      inset: 0 0 auto;
      z-index: 100;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      padding: 1rem 4vw;
      background: rgba(245, 243, 238, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(26, 45, 61, 0.07);
    }
    .nav-brand { display: flex; align-items: center; flex-wrap: wrap; row-gap: 0.28rem; }
    .nav-logo {
      color: #1a2d3d;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .nav-tagline {
      display: inline;
      margin-left: 1.2rem;
      padding-left: 1.2rem;
      border-left: 1px solid rgba(26, 45, 61, 0.12);
      color: #5a6a78;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.76rem;
      font-weight: 300;
      letter-spacing: 0.16em;
      line-height: 1.6;
      text-transform: uppercase;
    }
    .nav-tagline strong { color: #1a2d3d; font-weight: 700; }
    .nav-links {
      display: flex;
      gap: clamp(1rem, 2vw, 2.5rem);
      margin: 0;
      padding: 0;
      list-style: none;
      white-space: nowrap;
    }
    .nav-links a {
      color: #5a6a78;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: #1a9e8a; }
    .observatory-frame {
      display: block;
      width: 100%;
      height: calc(100vh - 64px);
      min-height: 620px;
      margin-top: 64px;
      border: 0;
      background: #f4f3f0;
    }
    @media (max-width: 820px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      .nav-tagline { display: none; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-brand">
      <a href="/" class="nav-logo">Pedro Martins</a>
      <span class="nav-tagline">Converte a <strong>AI</strong> em vantagens competitivas reais e sustentáveis</span>
    </div>
    {% include '_nav_toggle.html' %}
    <ul class="nav-links" id="site-nav-links">
      <li><a href="/framework">Framework</a></li>
      <li><a href="#">Serviços</a></li>
      <li><a href="/observatorio" class="active" aria-current="page">Observatório</a></li>
      <li><a href="/publicacoes/ai-gov">Publicações</a></li>
      <li><a href="mailto:info@ai-gov.network">Contacto</a></li>
    </ul>
  </nav>

  <iframe
    class="observatory-frame"
    src="/static/observatorio/procura-tic-anuncios-pt-ue.html"
    title="Procura de especialistas TIC — Portugal vs. UE"
  ></iframe>

  {% include '_legal_footer.html' %}
</body>
</html>
